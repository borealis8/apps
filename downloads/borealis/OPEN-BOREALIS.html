 <div class="workspace"><aside class="left-panel ${mobileProject?'mobile-open':''}"><div class="panel-tabs"><button class="${leftTab==='project'?'active':''}" data-left="project">Project</button><button class="${leftTab==='library'?'active':''}" data-left="library">Library</button></div><div class="left-body">${leftTab==='project'?projectPanel():libraryPanel()}</div><div class="left-footer"><span class="workspace-icon">${icon('spark')}</span><div><strong>Made for your next idea</strong><small>Your personal hardware workspace</small></div></div></aside>
 <main class="editor"><div class="editor-top"><div class="view-tabs">${['schematic','pcb','bom'].map(v=>`<button class="${mode===v?'active':''}" data-mode="${v}">${icon(v==='schematic'?'wire':v==='pcb'?'layers':'grid')}${v==='pcb'?'PCB':v==='bom'?'BOM':'Schematic'}</button>`).join('')}</div><div class="editor-actions"><span class="branch-dot"></span><span>main</span>${button('history','Undo last change','undo')}${button('redo','Redo change','redo')}<span class="separator"></span><button class="text-btn" data-action="check">${icon('check')} Check design</button></div></div>
 <div class="canvas-wrap ${mode==='pcb'?'pcb-mode':''}" id="canvas-wrap">${mode==='bom'?bomTable():canvas()}${mode!=='bom'?`<div class="canvas-title"><span class="eyebrow">BOREALIS / ${mode==='pcb'?'BOARD LAYOUT':'SCHEMATIC'}</span><h2>${mode==='pcb'?'The details make the difference.':'A little idea. A world of possibilities.'}</h2><p>${mode==='pcb'?'Concept layout · preview only':'ESP32 · Connected environmental sensor'}</p></div><div class="floating-toolbar">${button('arrow','Select · V','select',tool==='select'?'selected':'')}${button('wire','Connect pins · W','wire',tool==='wire'?'selected':'')}${button('plus','Add component · A','library')}${button('rotate','Rotate selected · R','rotate')}<span class="separator"></span>${button('undo','Undo · Ctrl+Z','undo')}${button('trash','Delete selected · Delete','delete')}</div><div class="canvas-hint">${tool==='wire'?'<span class="green">●</span> '+(wireStart?'Choose a destination pin':'Click a component pin to start a wire'):'<kbd>V</kbd> Select <span>·</span> <kbd>W</kbd> Wire <span>·</span> Space + drag to pan'}</div><div class="canvas-controls"><button data-action="zoom-out" aria-label="Zoom out">−</button><span>${Math.round(zoom*100)}%</span><button data-action="zoom-in" aria-label="Zoom in">+</button><span class="separator"></span>${button('expand','Fit to screen','fit')}</div><div class="canvas-label">${icon('layers')} ${mode==='pcb'?'Top copper · concept view':'Sheet 1 of 1'}<span>Metric</span></div>`:''}</div>
 <footer class="statusbar"><span><i class="dot"></i> Local workspace <span class="status-divider">/</span> ${project.components.length} components <span class="status-divider">/</span> ${project.nets.length} connections</span><button data-action="check"><span class="warning-dot"></span>${issues.length} checks to review</button><span class="status-right">${mode==='pcb'?'Layout preview':'Grid: 20 mil'} <span class="status-divider">|</span> ${icon('globe')} Saved on this device</span></footer></main>
 <aside class="right-panel ${mobileAssistant?'mobile-open':''}"><div class="right-tabs"><button class="${rightTab==='assistant'?'active':''}" data-right="assistant">${icon('spark')} Assistant</button><button class="${rightTab==='properties'?'active':''}" data-right="properties">Properties</button><button class="mobile-close" data-action="close-assistant" aria-label="Close assistant">${icon('close')}</button></div>${rightTab==='assistant'?assistantPanel():propertiesPanel(c)}</aside></div></div>`;
 bind();renderBoard();
}
function projectPanel(){return `<div class="panel-heading"><span>YOUR PROJECTS</span>${button('plus','Create project','new')}</div><div class="project-list">${projects.map(p=>`<button class="project-item ${p===project?'active':''}" data-project="${esc(p.id)}">${icon('chip')}<span>${esc(p.name)}</span>${p===project?'<i class="green-dot"></i>':''}</button>`).join('')}</div><div class="panel-heading spaced"><span>DOCUMENT OUTLINE</span><small>${project.components.length}</small></div><button class="outline-sheet" data-mode="schematic">${icon('down')}${icon('wire')} Schematic <span>01</span></button><div class="component-list">${project.components.map(c=>`<button class="component-item ${c.id===selected?'active':''}" data-select="${esc(c.id)}"><span class="component-type">${icon(c.kind==='mcu'||c.kind==='sensor'?'chip':'wire')}</span><strong>${esc(c.id)}</strong><span>${esc(c.name)}</span></button>`).join('')}</div><button class="add-component" data-action="library">${icon('plus')} Add a component <kbd>A</kbd></button><div class="panel-heading spaced"><span>PROJECT DETAILS</span></div><div class="project-details"><div><span>Owner</span><strong>You</strong></div><div><span>Visibility</span><strong>Private · local</strong></div><div><span>Components</span><strong>${project.components.length}</strong></div><div><span>Est. BOM</span><strong>$${project.components.reduce((a,c)=>a+c.price,0).toFixed(2)}</strong></div></div>`;}
function libraryPanel(){return `<div class="library-heading"><h3>Find your next building block.</h3><p>A curated library for your ideas.</p></div><label class="search-field">${icon('search')}<input id="library-search" placeholder="Search components…" value="${esc(query)}" autocomplete="off"></label><select id="category" aria-label="Component category">${['All components',...new Set(catalog.map(c=>c.category))].map(t=>`<option ${t===activeCategory?'selected':''}>${t}</option>`).join('')}</select><div class="library-count">${catalog.filter(c=>(activeCategory==='All components'||activeCategory===c.category)&&(c.name+' '+c.value).toLowerCase().includes(query.toLowerCase())).length} components · curated library</div><div id="catalog">${catalog.filter(c=>(activeCategory==='All components'||activeCategory===c.category)&&(c.name+' '+c.value).toLowerCase().includes(query.toLowerCase())).map(c=>`<button class="catalog-card" data-add="${c.kind}"><span class="catalog-art">${mini(c)}</span><span><strong>${c.name}</strong><small>${c.value}</small><em>${c.category}</em></span>${icon('plus')}</button>`).join('')||'<p class="empty">No matching components.</p>'}</div><p class="library-note">Parts are simplified symbols. Verify datasheets and footprints for production.</p>`;}
function canvas(){return `<svg id="board" class="board ${mode==='pcb'?'pcb-board':''}" aria-label="${mode==='pcb'?'PCB concept layout':'Editable circuit schematic'}" viewBox="0 0 1100 800"><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#35403a"/></pattern><pattern id="smallgrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#8ccba1" stroke-opacity=".06"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="2"/></filter></defs><rect width="100%" height="100%" fill="url(#dots)"/><g id="viewport"></g></svg>`;}
function renderBoard(rebind=true){const g=$('#viewport');if(!g)return;g.setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${zoom})`);const pcb=mode==='pcb';let html=pcb?'<rect x="65" y="140" width="930" height="520" rx="25" fill="#16332b" stroke="#648a6b" stroke-width="2"/><rect x="65" y="140" width="930" height="520" rx="25" fill="url(#smallgrid)"/>'+[[90,165],[970,165],[90,635],[970,635]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="#131819" stroke="#78917d" stroke-width="5"/>`).join('')+'<text x="100" y="600" fill="#9cad9b" font-size="17" font-family="monospace">BOREALIS — SENSOR REV 1.0</text><text x="100" y="622" fill="#718978" font-size="10" font-family="monospace">CONCEPT PLACEMENT · NOT FABRICATION READY</text>':'';
 for(const n of project.nets){const a=project.components.find(c=>c.id===n.from.split(':')[0]),b=project.components.find(c=>c.id===n.to.split(':')[0]);if(!a||!b)continue;const p=pinPosition(a,+n.from.split(':')[1]),q=pinPosition(b,+n.to.split(':')[1]),mid=(p.x+q.x)/2;html+=`<g class="net ${pcb?'copper':''}" data-net="${esc(n.id)}"><path d="M${p.x} ${p.y}H${mid}V${q.y}H${q.x}" fill="none" stroke="${pcb?'#caa764':'#608b6d'}" stroke-width="${pcb?3:1.8}"/><circle cx="${p.x}" cy="${p.y}" r="3"/><circle cx="${q.x}" cy="${q.y}" r="3"/>${!pcb?`<text x="${mid+7}" y="${(p.y+q.y)/2-8}" fill="#6d8d77" font-size="10">${esc(n.label)}</text>`:''}</g>`;}
 html+=project.components.map(c=>`<g class="circuit-part ${c.id===selected?'is-selected':''}" data-component="${esc(c.id)}" transform="translate(${c.x} ${c.y})"><rect class="selection-box" x="-77" y="${c.kind==='mcu'?-100:-58}" width="154" height="${c.kind==='mcu'?205:125}" rx="8"/><g transform="rotate(${c.rotation||0})" class="symbol">${pcb?`<rect x="-43" y="-27" width="86" height="54" rx="3" fill="#191e21" stroke="#d5cba3" stroke-width="1.4"/>${[0,1].map(pin=>`<rect x="${pin===0?-64:47}" y="-8" width="17" height="16" rx="2" fill="#cba86b"/>`).join('')}<text text-anchor="middle" y="4" fill="#a7aba6" font-size="10">${esc(c.id)}</text>`:symbol(c)}</g>${!pcb?`<text class="reference" x="0" y="${c.kind==='mcu'?-83:-43}" text-anchor="middle">${esc(c.id)}</text><text class="part-value" x="0" y="${c.kind==='mcu'?94:53}" text-anchor="middle">${esc(c.kind==='mcu'?'Wi-Fi / Bluetooth':c.value)}</text>`:`<text class="pcb-ref" x="0" y="-39" text-anchor="middle">${esc(c.id)}</text>`}${[0,1].map(pin=>{const p=pinPosition({...c,x:0,y:0},pin);return `<circle class="pin ${wireStart===c.id+':'+pin?'pending':''}" data-pin="${esc(c.id)}:${pin}" cx="${p.x}" cy="${p.y}" r="${tool==='wire'?7:4}"/>`;}).join('')}</g>`).join('');
 g.innerHTML=html;if(rebind)bindCanvas();}
function bomTable(){return `<div class="bom-header"><div><span class="eyebrow">PROJECT / BILL OF MATERIALS</span><h2>Everything your idea is made of.</h2><p>${project.components.length} components · Estimated $${project.components.reduce((a,c)=>a+c.price,0).toFixed(2)} / board · Illustrative pricing</p></div><button class="soft-button" data-action="csv">${icon('download')} Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Component</th><th>Value / Description</th><th>Est. cost</th></tr></thead><tbody>${project.components.map(c=>`<tr data-select="${esc(c.id)}"><td><span class="ref-badge">${esc(c.id)}</span></td><td>${esc(c.name)}</td><td>${esc(c.value)}</td><td>$${c.price.toFixed(2)}</td></tr>`).join('')}</tbody></table></div><p class="bom-note">Prices are illustrative. This workspace does not query live supplier inventory.</p>`;}
function assistantPanel(){return `<div class="assistant-content"><div class="assistant-greeting"><div class="assistant-orb">${icon('spark')}</div><span class="eyebrow">YOUR HARDWARE COMPANION</span><h2>Good ideas<br>start with a spark.</h2><p>A little guidance for your next big thing. Let’s build something together.</p></div><div class="project-context">${icon('chip')}<div><strong>Working with your schematic</strong><small>${project.components.length} components · ${project.nets.length} connections</small></div><span class="dot"></span></div>${messages.length?`<div class="messages">${messages.map(m=>`<div class="message ${m.role}">${m.role==='assistant'?`<span class="message-label">${icon('spark')} BOREALIS</span>`:''}<p>${esc(m.text)}</p>${m.kind?`<button class="soft-button apply-part" data-add="${m.kind}" data-message="${m.id}">${icon('plus')} Add ${esc(catalog.find(c=>c.kind===m.kind).name)}</button>`:''}</div>`).join('')}</div>`:`<div class="suggestion-label">A FEW PLACES TO START</div><div class="suggestions"><button data-prompt="Review my design and check connections">${icon('check')} Review my design${icon('chevron')}</button><button data-prompt="Add a temperature and humidity sensor">${icon('chip')} Add a sensor${icon('chevron')}</button><button data-prompt="Estimate my BOM cost">${icon('grid')} Estimate project cost${icon('chevron')}</button></div><div class="assistant-tip">${icon('bulb')}<p>Small detail, big difference.<br><span>Keep decoupling capacitors close to power pins.</span></p></div>`}</div><div class="chat-bottom"><form id="chat-form"><textarea id="chat-input" rows="3" placeholder="${chatBusy?'Thinking…':'What would you like to build?'}" aria-label="Ask the local design assistant" maxlength="2000"></textarea><div class="composer-bottom"><span>${icon('chip')} Current project</span><button class="send-button" type="submit" aria-label="Send message">${icon('send')}</button></div></form><div class="assistant-disclosure"><span class="dot"></span> ${chatBackend==='provider'?'AI provider · connected': 'Local assistant · rules-based'} ${button('help','About the local assistant','about-ai')}</div></div>`;}
function propertiesPanel(c){return `<div class="properties-content">${c?`<div class="property-art">${mini(c)}</div><span class="eyebrow">SELECTED COMPONENT</span><h2>${esc(c.id)} <small>${esc(c.name)}</small></h2><p class="muted">Simplified two-terminal symbol</p><form id="property-form"><label>Reference<input value="${esc(c.id)}" disabled></label><label>Value / Description<input name="value" value="${esc(c.value)}" maxlength="200" required></label><div class="two-fields"><label>X position<input name="x" type="number" value="${c.x}" min="-100000" max="100000" required></label><label>Y position<input name="y" type="number" value="${c.y}" min="-100000" max="100000" required></label></div><label>Rotation<select name="rotation">${[0,90,180,270].map(r=>`<option value="${r}" ${r===c.rotation?'selected':''}>${r}°</option>`).join('')}</select></label><button class="primary-button full" type="submit">Apply changes</button></form><div class="property-summary"><span>Est. unit price</span><strong>$${c.price.toFixed(2)}</strong></div><button class="danger-button" data-action="delete">${icon('trash')} Remove component</button>`:'<div class="empty-state">'+icon('arrow')+'<h3>A closer look.</h3><p>Select a component to edit its properties.</p></div>'}</div>`;}
function addComponent(kind){mobileProject=false;const c=catalog.find(c=>c.kind===kind);if(!c)return;checkpoint();const i=project.components.length;const v=part(kind,nextId(project,c.prefix),200+(i%4)*200,230+Math.floor(i/4)%3*160);project.components.push(v);selected=v.id;mode='schematic';rightTab='properties';commit();toast(`${v.name} added · drag to position`);}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function modal(title,body){$('#modal-root').innerHTML=`<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-top"><h2>${title}</h2>${button('close','Close dialog','close')}</div>${body}</section></div>`;$('#modal-root [data-action="close"]').onclick=closeModal;$('.modal-shade').onclick=e=>{if(e.target.classList.contains('modal-shade'))closeModal();};setTimeout(()=>$('.modal input, .modal button')?.focus(),0);}
function closeModal(){$('#modal-root').innerHTML='';}
function exportModal(){modal('Take your project with you.',`<p class="muted">Your ideas belong to you. Choose a format to download.</p><div class="export-options"><button data-export="json">${icon('folder')}<span><strong>Project file</strong><small>Editable JSON · reopen in Borealis</small></span>${icon('download')}</button><button data-export="csv">${icon('grid')}<span><strong>Bill of materials</strong><small>CSV · illustrative component costs</small></span>${icon('download')}</button><button data-export="svg">${icon('wire')}<span><strong>Schematic drawing</strong><small>SVG · vector document</small></span>${icon('download')}</button></div><p class="modal-note">Concept editor only. Gerber, manufacturing, simulation and full ECAD pin models are not implemented.</p>`);document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const type=b.dataset.export;if(type==='json')download('borealis-project.json',JSON.stringify(project,null,2),'application/json');if(type==='csv')download('borealis-bom.csv',bomCsv(project),'text/csv');if(type==='svg'){mode='schematic';render();const clone=$('#board').cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width','1100');clone.setAttribute('height','800');clone.querySelectorAll('.selection-box').forEach(n=>n.remove());clone.querySelector('#viewport').setAttribute('transform','');clone.querySelectorAll('.symbol').forEach(n=>n.setAttribute('color','#7bab8b'));clone.querySelectorAll('.reference,.part-value').forEach(n=>{n.setAttribute('fill','#cedbd2');n.setAttribute('font-family','monospace');n.setAttribute('font-size','12');});download('borealis-schematic.svg',new XMLSerializer().serializeToString(clone),'image/svg+xml');}closeModal();toast('Download ready');});}
function checkModal(){const issues=checkDesign(project);modal('Design review',`<div class="review-summary">${icon('check')}<div><strong>${issues.length} items to review</strong><span>${project.components.length} components · ${project.nets.length} connections checked</span></div></div><p class="muted">Basic open-pin and component-overlap checks. No electrical simulation, footprint checks, clearance or manufacturing validation.</p><div class="issue-list">${issues.map(i=>`<button data-issue="${esc(i.id)}"><span class="warning-dot"></span>${esc(i.message)}${icon('chevron')}</button>`).join('')||'<p>No open pins or overlapping components detected.</p>'}</div>`);document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{selected=b.dataset.issue;rightTab='properties';mode='schematic';closeModal();render();});}
async function ask(prompt){if(!prompt.trim()||chatBusy)return;messages.push({role:'user',text:prompt});if(chatBackend==='provider'){chatBusy=true;render();try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,project})});const data=await res.json();if(!res.ok)throw new Error(data.error||'AI request failed');messages.push({role:'assistant',text:data.text,id:crypto.randomUUID()});}catch(e){messages.push({role:'assistant',text:'AI request failed: '+e.message+' You can switch to the local assistant in workspace settings.',id:crypto.randomUUID()});}finally{chatBusy=false;}}else{const reply=localPlan(prompt,project);messages.push({role:'assistant',...reply,id:crypto.randomUUID()});}render();$('.assistant-content').scrollTop=$('.assistant-content').scrollHeight;}

function action(a){if(a==='assistant'){mobileProject=false;rightTab='assistant';mobileAssistant=true;render();}else if(a==='close-assistant'){mobileAssistant=false,mobileProject=false;render();}else if(a==='library'){mobileAssistant=false;mobileProject=true;leftTab='library';render();$('#library-search')?.focus();}else if(a==='workspace'){mobileAssistant=false;mobileProject=!mobileProject;leftTab='project';render();}else if(a==='undo')undo();else if(a==='redo')redo();else if(a==='select'||a==='wire'){tool=a;wireStart=null;render();}else if(a==='rotate'){const c=project.components.find(c=>c.id===selected);if(!c)return;checkpoint();c.rotation=((c.rotation||0)+90)%360;commit();}else if(a==='delete'){if(!selected)return;checkpoint();project.components=project.components.filter(c=>c.id!==selected);project.nets=project.nets.filter(n=>!n.from.startsWith(selected+':')&&!n.to.startsWith(selected+':'));selected=null;commit();}else if(a==='zoom-in'||a==='zoom-out'){zoom=Math.max(.35,Math.min(2,zoom+(a==='zoom-in'?.1:-.1)));render();}else if(a==='fit'){zoom=1;pan={x:0,y:0};render();}else if(a==='export')exportModal();else if(a==='check')checkModal();else if(a==='csv')download('borealis-bom.csv',bomCsv(project),'text/csv');else if(a==='new'||a==='rename'){modal(a==='new'?'A new idea starts here.':'Name your project',`<form id="name-form"><label>Project name<input id="new-name" required maxlength="100" placeholder="My next big idea" value="${a==='rename'?esc(project.name):''}"></label><button class="primary-button full" type="submit">${a==='new'?'Create project':'Save name'}</button></form>`);$('#name-form').onsubmit=e=>{e.preventDefault();const name=$('#new-name').value.trim();if(!name)return;if(a==='new'){project={id:crypto.randomUUID(),name,components:[],nets:[],updatedAt:Date.now()};projects.push(project);selected=null;history=[];future=[];messages=[];}else{checkpoint();project.name=name;}closeModal();commit();};}else if(a==='share'){modal('Your private workspace',`<p>Projects are saved only in this browser. To share an editable copy, export the project JSON and send the file to a collaborator.</p><button id="share-download" class="primary-button full">${icon('download')} Download project to share</button><p class="modal-note">Live collaboration and cloud synchronization are not connected.</p>`);$('#share-download').onclick=()=>{download('borealis-project.json',JSON.stringify(project,null,2),'application/json');closeModal();};}else if(a==='settings'){modal('Make yourself at home.',`<p class="muted">Borealis · Your personal hardware workspace</p><label class="assistant-mode-label">Assistant mode<select id="assistant-mode"><option value="local" ${chatBackend==='local'?'selected':''}>Local · rules-based · works offline</option><option value="provider" ${chatBackend==='provider'?'selected':''} ${!providerAvailable?'disabled':''}>AI provider ${providerAvailable?'· configured':'· not configured'}</option></select></label><p class="modal-note">${providerAvailable?'A server-side AI provider is available. Prompts and the current schematic are sent to that provider only when AI provider mode is selected.':'To enable live AI, set BOREALIS_AI_KEY securely on the server. Optional BOREALIS_AI_MODEL and BOREALIS_AI_URL configure an OpenAI-compatible provider. Never enter API keys in the browser.'}</p><button id="import-project" class="soft-button full">${icon('folder')} Import a Borealis project</button><p class="modal-note">Your projects are stored locally on this device. Export backups regularly. No account is required.</p>`);$('#assistant-mode').onchange=e=>{chatBackend=e.target.value;localStorage.setItem('borealis-assistant-mode',chatBackend);render();};$('#import-project').onclick=()=>{closeModal();$('#import-file').click();};}else if(a==='history'){modal('Project history',`<p>${history.length} changes available to undo in this session.</p><p class="muted">Undo and redo apply to the current project. Saved projects persist in this browser.</p><button class="soft-button full" id="modal-undo">${icon('undo')} Undo last change</button>`);$('#modal-undo').onclick=()=>{closeModal();undo();};}else if(a==='about-ai')modal('A transparent design companion',`<p>This assistant uses local, deterministic rules to inspect connections, estimate illustrative BOM costs and suggest components.</p><p class="muted">It does not call an AI model, reproduce Flux’s private AI, simulate circuits, or validate manufacturing readiness. Its suggestions require engineering review.</p>`);else if(a==='help')modal('Room for your next bright idea.',`<p>Borealis Circuit Studio is an independently implemented, Flux-inspired concept editor.</p><ul class="help-list"><li><kbd>V</kbd> Select and drag components</li><li><kbd>W</kbd> Connect two component pins</li><li><kbd>A</kbd> Open the component library</li><li><kbd>R</kbd> Rotate selected component</li><li><kbd>Delete</kbd> Remove selection and connected nets</li><li><kbd>Ctrl / ⌘ Z</kbd> Undo · Shift to redo</li><li><kbd>Space + drag</kbd> Pan · mouse wheel to zoom</li></ul><p class="muted">Use Properties to edit values. Use Export to download projects, drawings, or a BOM. PCB mode is a concept preview.</p>`);}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{leftTab=b.dataset.left;render();});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{rightTab=b.dataset.right;render();});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;rightTab='properties';render();});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const kind=b.dataset.add,id=b.dataset.message;if(id){const m=messages.find(m=>m.id===id);if(m){m.kind=null;m.text+='\n\nComponent added to the schematic.';}}addComponent(kind);});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{project=projects.find(p=>p.id===b.dataset.project);selected=null;history=[];future=[];messages=[];render();});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>ask(b.dataset.prompt));if($('#chat-form')){$('#chat-form').onsubmit=e=>{e.preventDefault();ask($('#chat-input').value);};$('#chat-input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.target.value);}};}if($('#library-search'))$('#library-search').oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;render();$('#library-search').focus();$('#library-search').setSelectionRange(pos,pos);};if($('#category'))$('#category').onchange=e=>{activeCategory=e.target.value;render();};if($('#property-form'))$('#property-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target),c=project.components.find(c=>c.id===selected);checkpoint();c.value=data.get('value');c.x=+data.get('x');c.y=+data.get('y');c.rotation=+data.get('rotation');commit();toast('Component updated');};}
let space=false;
function bindCanvas(){const svg=$('#board');if(!svg)return;const local=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const v=p.matrixTransform(svg.getScreenCTM().inverse());return{x:(v.x-pan.x)/zoom,y:(v.y-pan.y)/zoom};};let drag=null;
 svg.onpointerdown=e=>{const pin=e.target.closest('[data-pin]'),el=e.target.closest('[data-component]');if(pin&&tool==='wire'){const id=pin.dataset.pin;if(!wireStart){wireStart=id;render();return;}if(id===wireStart){wireStart=null;render();return;}if(!project.nets.some(n=>(n.from===wireStart&&n.to===id)||(n.to===wireStart&&n.from===id))){checkpoint();project.nets.push({id:crypto.randomUUID(),from:wireStart,to:id,label:'NET'+(project.nets.length+1)});save();toast('Connection created');}wireStart=null;render();return;}
 if(space||e.button===1){drag={pan:true,x:e.clientX,y:e.clientY,ox:pan.x,oy:pan.y};svg.setPointerCapture(e.pointerId);e.preventDefault();return;}
 if(el&&tool==='select'){selected=el.dataset.component;rightTab='properties';const c=project.components.find(c=>c.id===selected),p=local(e);checkpoint();drag={c,dx:p.x-c.x,dy:p.y-c.y};svg.setPointerCapture(e.pointerId);svg.querySelectorAll('.circuit-part').forEach(g=>g.classList.toggle('is-selected',g.dataset.component===selected));}else if(!el&&tool==='select'){selected=null;rightTab='assistant';render();}};
 svg.onpointermove=e=>{if(!drag)return;if(drag.pan){const scale=svg.viewBox.baseVal.width/svg.getBoundingClientRect().width;pan.x=drag.ox+(e.clientX-drag.x)*scale;pan.y=drag.oy+(e.clientY-drag.y)*scale;}else{const p=local(e);drag.c.x=Math.round((p.x-drag.dx)/10)*10;drag.c.y=Math.round((p.y-drag.dy)/10)*10;}renderBoard(false);};
 const end=()=>{if(!drag)return;drag=null;save();render();};svg.onpointerup=end;svg.onpointercancel=end;svg.onwheel=e=>{e.preventDefault();zoom=Math.max(.35,Math.min(2,zoom+(e.deltaY<0?.05:-.05)));render();};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();wireStart=null;tool='select';render();return;}if(e.target.matches('input,textarea,select'))return;if(e.code==='Space'){space=true;e.preventDefault();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}const actions={v:'select',w:'wire',a:'library',r:'rotate',Delete:'delete',Backspace:'delete'};if(actions[e.key]){e.preventDefault();action(actions[e.key]);}});document.addEventListener('keyup',e=>{if(e.code==='Space')space=false;});
$('#import-file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>2e6)throw new Error('Project file must be smaller than 2 MB');const p=validateProject(JSON.parse(await file.text()));p.id=crypto.randomUUID();projects.push(p);project=p;selected=null;history=[];future=[];commit();toast('Project imported');}catch(err){toast('Import failed: '+err.message);}finally{e.target.value='';}};
render();
